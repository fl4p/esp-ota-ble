; Prototype LoRaWAN <-> RS-485 sensor node.
;
; Chain:  LoRa -> ESP32 -> UART -> RS485 click (MIKROE-989) -> RS-485 -> target
;
; The bridge hop is GONE as of 2026-09-09. It used to read "-> o2-probe bridge
; board -> RS-485", a spare probe flashed `pio run -e bridge` supplying the
; transceiver, and this file said a production node would talk RS-485 directly
; and drop that hop. This is that node. See src/config.h for the wiring and for
; what the bridge's address-250 self-test used to prove and no longer can.
[env:esp32s3]
; PINNED, and it has to be now that NimBLE is in the build. The bare name
; "espressif32" is TWO different platforms from two different repos -
; pioarduino's (arduino-esp32 3.x) and platformio's abandoned official one
; (arduino-esp32 2.0.17) - and an unpinned entry can silently swap between
; them. h2zero/NimBLE-Arduino 2.x requires core 3.x; on the 2.0.17 platform it
; does not compile, and the error names NimBLE internals rather than the
; platform that actually changed underneath. 55.03.311 = ESP-IDF 5.5.x +
; arduino-esp32 3.3.11, which is what this tree has been building against all
; along - so this pins the status quo, it does not move it.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1       ; override for the actual board
framework = arduino
monitor_speed = 115200
; Stamps NODE_BUILD_ID - the commit plus a dirty bit - for the `caps` verb, and
; fails the build if git cannot say what is being built. tools/pio_build_id.py.
extra_scripts = pre:tools/pio_build_id.py
board_build.partitions = partitions.csv
; THE BOARD HAS 4 MB, AND NOTHING HERE SAID SO.
;
; `board = esp32-s3-devkitc-1` is a stand-in for the actual Waveshare S3-Zero
; and its definition declares 8 MB. partitions.csv has said "# 4 MB layout" on
; its first line since the file was written, so the discrepancy was visible and
; inert - because `pio run -t upload` writes only the app at 0x10000 and leaves
; the bootloader alone.
;
; It stops being inert the moment anything flashes bootloader.bin. Its image
; header then declares 8192k against a 4096k chip and the second-stage
; bootloader asserts before a single line of application code runs:
;
;   E spi_flash: Detected size(4096k) smaller than the size in the binary image
;                header(8192k). Probe failed.
;   assert failed: __esp_system_init_fn_init_flash startup_funcs.c:118
;   Rebooting...
;
; which is an unrecoverable boot loop that looks exactly like a hung
; application: permanently enumerated, no uplinks, and - because the loop never
; reaches deep sleep - never absent from /dev. MEASURED 2026-09-07, and it cost
; a wrong diagnosis before the console was readable.
;
; Declaring it here fixes the header at build time for every env, so the trap
; is gone rather than merely avoided by not flashing that file.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
lib_deps =
	; PINNED EXACTLY, NOT A RANGE, AND THE DUTY-CYCLE ACCOUNTING IS WHY.
	;
	; ^7.1.0 let any 7.x resolve. That is normally the right default, but the
	; EU868 1 % duty cycle is a legal limit and the code that enforces it reads
	; RadioLib's internals rather than its public contract:
	;
	;   CountingSX1262 (src/main.cpp) overrides the virtual stageMode() and
	;   launchMode() to count every frame the radio is actually told to send,
	;   and prices each one with getTimeOnAir() at the instant RF starts.
	;   DutyLoRaWANNode reaches the protected channels[], band and nbTrans.
	;
	; A rename breaks the BUILD, which is fine - that is a failure that shows
	; up immediately. The hazard is the other kind: a later 7.x keeps every
	; name and changes WHEN something happens. Three defects fixed here were
	; exactly that shape - lastToA is zeroed before transmitting and not
	; restored on TX_TIMEOUT (LoRaWAN.cpp:173, 1535, 1551), and sendReceive()
	; recursively transmits a MAC-only uplink with the duty guard lifted
	; (LoRaWAN.cpp:2271-2277). Move either of those and the accounting silently
	; goes wrong while the build stays green and the node keeps transmitting.
	;
	; So the version is part of the safety argument, and upgrading it means
	; re-reading those call sites, not just watching the compiler. Verified
	; against 7.7.1; see docs and the test/dutycharge_host_test.cpp cases.
	jgromes/RadioLib @ 7.7.1
	; OTA over BLE. The receiver is transport-agnostic - a staging ring, a
	; credit window, a streaming SHA-256 and the esp_ota_* calls - and knows
	; nothing about BLE; src/bleota.cpp owns the GATT layer. Shared with
	; fugu-mppt-firmware and smart-shunt-fw, where it was validated on hardware
	; at ~32 kB/s with a truncated image correctly rejected.
	;
	; THE PAYLOAD TRANSFORMS NEED lib/. This receiver can accept a tamp-
	; compressed image or a delta patch instead of the raw one, and it gates both
	; on __has_include. The dependencies are declared in the module's
	; idf_component.yml, which ONLY an ESP-IDF build reads - this env is
	; framework = arduino and resolves through library.json, which declares
	; neither. lib/tamp and lib/esp_delta_ota are vendored for exactly that
	; reason; delete them and the receiver silently advertises "raw" alone, the
	; host sends the whole image, and nothing anywhere reports a problem. See
	; lib/tamp/README.md.
	;
	; A git URL rather than smart-shunt-fw's `symlink://../esp-ota-ble`: that
	; repo co-develops the module and needs local edits to take effect, this
	; one only consumes it. For a local checkout swap in
	;   symlink:///Users/fab/o2p-push/ota-throughput-next/esp-ota-ble
	; PINNED TO A COMMIT, not to the branch. This node is the field-update
	; master for every o2 probe on its RS-485 bus, so "whatever main happened to
	; be at" is not an acceptable answer to which receiver its firmware contains
	; - and a bare branch URL is cached, so a stale copy is invisible in the
	; build log. Bump deliberately.
	symlink:///Users/fab/o2p-push/ota-throughput-next/esp-ota-ble   ; LOCAL, bench only - do not commit
	h2zero/NimBLE-Arduino @ ^2.5.1
build_flags =
	; The S3-Zero has no USB-UART chip: Serial goes to UART0 (GP43/44) unless
	; these route it to the native USB CDC. Without them the console is silent
	; on /dev/cu.usbmodem* and it looks like the sketch never ran.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; 9600 - THE BUS RATE, AND THIS IS A CHANGE OF KIND, NOT OF VALUE.
	;
	; It was 115200 until 2026-09-09, and correctly so: this UART reached a
	; spare o2-probe flashed `pio run -e bridge`, which was store-and-forward
	; rather than a level shifter, so the host leg was free to run faster than
	; the cable and had to equal the bridge's compiled O2P_BRIDGE_HOST_BAUD.
	;
	; With the bridge MCU retired and a MikroElektronika RS485 click 3.3V
	; (MIKROE-989) in its place, there is no second UART and no re-transmission:
	; these bytes ARE the bytes on the pair. So this must be the probe's own
	; rate - 9600, the default in o2-probe firmware/src/regmap.h:664, which is
	; also what the Truebner SMT100s and the Dragino (AT+BAUDR=9600) use. At
	; 115200 the node would be shouting past every device on the cable and every
	; poll would time out, with no error anywhere to say why.
	;
	; THE BUS IS STILL RE-RATEABLE, but not from here alone. The probe accepts a
	; new BAUD_CODE on probation and reverts after 10 s unless a frame arrives
	; at the new rate, so raising it needs firmware here that follows the probe
	; inside that window - Serial1.updateBaudRate() between the write and the
	; deadline. That code does not exist; 9600 is not a ceiling, it is the rate
	; nobody has yet written the handshake to leave.
	; 9600. THIS LINE HAS BEEN CHANGED THREE TIMES IN ONE DAY - read before the
	; fourth. It was 115200 while a bench bridge board re-transmitted onto the
	; cable at a different rate, and 115200 was correct then: the host leg was
	; private and had to match O2P_BRIDGE_HOST_BAUD. It became the BUS rate on
	; 2026-09-09 when the bridge MCU was retired for a MikroElektronika RS485
	; click, was set to 9600, was reverted to 115200 by commit 753aa83 ("baud
	; rate alignment to 115200"), and is 9600 again here.
	;
	; What settles it: the probe is on 9600 8E1, Modbus RTU, slave 3 - the
	; o2-probe compiled default at regmap.h:664, matching the Truebner SMT100s
	; and the Dragino's AT+BAUDR=9600 / AT+PARITY=2. There is no longer a
	; re-transmitting hop that could hold a different rate on each side, so this
	; number IS what appears on the pair. At 115200 the node shouts past every
	; device on the cable and every poll times out with no error to say why.
	-DO2P_UART_BAUD=9600
	; 8E1, and for the same reason: the probe's compiled parity, not a private
	; link's. regmap.h:664 gives even parity, matching the Dragino's AT+PARITY=2.
	; A parity mismatch is silence, not an error.
	;
	; The bridge's constraints are gone with the bridge: the 5632-baud floor at
	; bridge_main.c:99 (a 256-byte ADU inside O2P_BUART_TX_TIMEOUT_MS) bounded a
	; store-and-forward hop that no longer exists.
	-DO2P_UART_PARITY_EVEN=1
	-DO2P_FPORT=10
	; NimBLE's own logs go through ESP_LOG at the IDF level; without this the
	; controller is silent about a link it just dropped, which during a failed
	; push is the one thing worth knowing.
	-DCORE_DEBUG_LEVEL=3

; RS-485 scope fixture. Radio, BLE and the LoRaWAN session are not in the build
; at all, so a silence on the pair is the UART, the click or the cable.
;
; Repeats: 16 x 0x55 at the bus rate, then the real FC03 to slave 3, then 200 ms
; of listening. Between cycles R/T is low and the pair is undriven - if the
; differential does NOT collapse there, the direction line is stuck and this
; node is muting the cable. `-DBUSTEST_CONTINUOUS=1` sends 0x55 with no gaps
; (easier to trigger, but nothing else can transmit while it runs).
[env:bustest]
extends = env:esp32s3
build_src_filter = -<*> +<bustest.cpp>
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST

; Same fixture, unbroken carrier: 0x55 with no gaps, so a meter or an
; untriggered scope reads a real level instead of a 3.7 %-duty average.
; R/T STAYS HIGH THE WHOLE TIME - nothing can answer and no other device on the
; cable can transmit. Bench only, and briefly.
[env:bustest_carrier]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_CONTINUOUS=1

; Static DC test: R/T driven high as a plain GPIO, UART idle, so the pair sits
; at the idle mark continuously and a multimeter can read it. Measure against
; the CLICK'S OWN CN3.GND. Driver never releases - bench only.
[env:bustest_static]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_STATIC=1

; Baud sweep: ask slave 3 at each of the four rates the probe's BAUD_CODE
; allows, and report which one returns a CRC-VALID reply. Answers "what rate is
; this probe actually on" with evidence instead of a compiled default.
[env:bustest_sweep]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_SWEEP=1

; The sweep with TX and RX exchanged, for a harness wired the other way round.
; Also removes a hazard: if the wires ARE swapped, the default build drives the
; ESP32's push-pull TX straight into the click's push-pull receiver output.
[env:bustest_sweep_swap]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_SWEEP=1
	-DPIN_BUS_TX=3
	-DPIN_BUS_RX=2

; Receive-leg diagnostic: prints the R/T level at idle and whether the click's
; pin 14 is actually driving the MCU's RX pad, alongside one real exchange.
[env:bustest_rxdiag]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_RXDIAG=1

; The busy fixture at 9600 - the probe's own compiled default (o2-probe
; regmap.h:664), and 12x longer bursts than 115200 for scoping.
[env:bustest9600]
extends = env:bustest
; build_unflags, not -U: PlatformIO reorders and de-duplicates build_flags, so
; a -U followed by a -D in the same list is not guaranteed to survive in that
; order - it came out with the macro simply undefined.
build_unflags = -DO2P_UART_BAUD=115200
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DO2P_UART_BAUD=9600

; Bus scan: {9600,4800,2400} x {8N1,8E1} x addresses 1-8, CRC-checked. A reply
; from ANY device proves the receive leg. Built when a DFRobot SEN0601 (8N1,
; addr 1) was added to the pair as a known-good talker - the probe fixture at
; 8E1/slave 3 could not have heard it.
[env:bustest_scan]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_SCAN=1

; Bench bridge board back in the harness: ping its address-250 identity block
; at 115200 8E1 (its private host-link rate, NOT the bus rate), then slave 3.
; Tries both TX/RX pin orientations. Plain UART - the bridge owns direction.
[env:bustest_bridge]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_BRIDGE=1

; Pad health after a UART line was swapped with GND: internal pull-up/pull-down
; on GP1/GP2/GP3, no driving, so it cannot fight whatever is still connected.
[env:bustest_pins]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_PINS=1

; Park GP2 driven HIGH (a UART TX idle level), transmit nothing, so the far end
; can read its own RX pad without our pull-toggling confusing the measurement.
[env:bustest_park]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_PARK=1

; Single-variable burst: bridge identity block at address 250, 115200 8E1,
; TX=GP2/RX=GP3, every 500 ms. Address 250 never reaches the cable, so this
; proves the whole node<->bridge path with nothing on the pair.
[env:bustest_burst]
extends = env:bustest
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DBUSTEST_BURST=1

; The busy fixture at 9600 with the bus RX moved off GP3 to GP13.
;
; GP3 was reported dead on 2026-09-09 after a harness in which a UART line and
; GND were swapped - a push-pull output into a short is the one abuse that kills
; a pad quietly. GP13 is the remaining free non-strapping pad, and moving there
; also retires the ESP32-S3 JTAG-source strapping caveat that config.h has
; carried since 2026-09-07.
[env:bustest9600_gp13]
extends = env:bustest
build_unflags = -DO2P_UART_BAUD=115200
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_TEST
	-DO2P_UART_BAUD=9600
	-DPIN_BUS_RX=13

; Listen-only sniffer: plain UART (NOT RS485 half-duplex, which is itself under
; suspicion), R/T held LOW as a plain GPIO so the receiver is always enabled and
; this build can never drive the pair. Prints every byte with inter-byte gaps.
[env:bussniff]
extends = env:esp32s3
build_src_filter = -<*> +<bussniff.cpp>
build_unflags = -DO2P_UART_BAUD=115200
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_SNIFF
	-DSNIFF_BAUD=9600

; Same exchange as env:bustest9600 but with the direction pin toggled in
; SOFTWARE and a plain UART - i.e. UART_MODE_RS485_HALF_DUPLEX removed from the
; experiment. A reply here and not there isolates the fault to that mode.
[env:bussniff_poll]
extends = env:bussniff
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_SNIFF
	-DSNIFF_BAUD=9600
	-DSNIFF_POLL=1

[env:serialtest]
extends = env:esp32s3
build_src_filter = -<*> +<serialtest.cpp>
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DPROTO_SERIAL_TEST

; Bench bring-up: radio live, RS-485 never driven, console never disconnected.
;
; Use this whenever anything else is mastering the cable - a laptop on a
; USB-RS485 adapter, a bridge board still in someone's harness, or the Dragino
; on the farm bus. Two masters on one pair contend electrically, and since the
; node acquired its own transceiver that contention is on the FARM CABLE rather
; than on two bench pads. Also disables deep sleep, which drops the USB CDC on
; every wake and makes the node close to unobservable on a bench.
;
; NEVER push this image over the air: it cannot verify itself, because the
; evidence it would need is on the bus it refuses to touch.
[env:esp32s3_bench]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_NO_SLEEP
	-DPROTO_BUS_OFF

; Sleep bring-up: deep sleep LIVE, RS-485 still never driven.
;
; This exists because env:esp32s3_bench disables BOTH sleep and the bus, so the
; whole S3 slice - RTC-backed session, nonces, accumulated uptime, the rollback
; deadline across wakes - has only ever run in host tests. This build exercises
; it on real hardware while someone else still owns the cable, because
; PROTO_BUS_OFF is what makes that safe, not PROTO_NO_SLEEP.
;
; The console is NOT the instrument here: deep sleep drops the USB CDC on every
; wake, so evidence comes from the server side - fCnt incrementing by 1 per
; cycle with no join events means the RTC session survived the sleep. A stream
; of joins means it did not, and each one burns a DevNonce.
;
; Same warning as the bench build: never push this over the air. It cannot
; verify itself, because the evidence probe_answers() needs is on the bus it
; refuses to touch.
[env:esp32s3_sleeptest]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_OFF

; Mock probe: the o2-probe lives INSIDE the firmware, the RS-485 bus is still
; never driven.
;
; This is the build that proves the server half. Every stage downstream of the
; radio - farm-node-decoder.js, vm_ingest.py, the `gas` measurement, the oxygen
; dashboard - has so far only ever seen hand-written test vectors, because the
; node has never been allowed to reach the probe: while the bridge board was in
; the harness, the bench CP2102 lead (o2p_poll.py) and the ESP32's TX drove the
; same USART2 pads. So the probe is impersonated in src/mockprobe.cpp,
; byte-exact down to the Modbus CRC, and the whole chain runs without the node
; touching a pair. The hazard has moved to the cable rather than gone away.
;
; The uplink says so at the payver: 0x82, not 0x02. A synthetic reading is a
; separate series all the way into VictoriaMetrics (`gas_simulated`), so no
; panel, alert or person can read it as a measurement.
;
; POLL_INTERVAL_MS is 60 s rather than the field's 300 s: a dashboard being
; brought up needs points faster than a compost pile produces them. It is still
; well inside the 11-minute staleness window the Grafana panels use. Deep sleep
; stays LIVE - this is the field shape, and the sleep path is already proven on
; hardware (see README).
;
; NEVER push this over the air. Same reason as the bench build, plus one worse:
; it would report oxygen from a node that is measuring nothing.
[env:esp32s3_mock]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BUS_OFF
	-DPROTO_MOCK_PROBE
	-DPOLL_INTERVAL_MS=60000

; The image with NO BLE receiver in it. Not a bench variant - this is what a
; node that will only ever be updated over LoRaWAN should run, and it is here
; so the choice is a build target rather than a fork.
;
; READ THIS BEFORE PUSHING IT OVER BLE. Flashing this image over BLE destroys
; the path being used to flash it, and the only way back is a USB cable to a
; node that may be inside a compost pile. tools/ota_ble_push.py refuses an
; image with no OTAB strings in it for exactly this reason; --force exists and
; should be treated as the one-way door it is.
[env:esp32s3_noble]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_NO_BLE_OTA

; BENCH ONLY, TEMPORARY: 30 s poll cadence instead of 300 s, so a sleep/wake
; regression takes half a minute to observe instead of five. Everything else is
; env:esp32s3. Never provision a node with this - it is 10x the uplink rate the
; ChirpStack device profile's inactivity detection is tuned for, and 10x the
; duty cycle budget.
[env:esp32s3_fastpoll]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DPOLL_INTERVAL_MS=30000


; 60 s cadence, COMPILED IN. Unlike the runtime lease in cadence.h this
; survives a reset, a power cycle and a reflash, because it is not in RTC
; memory - which is the whole point, and also the hazard cadence.h exists to
; bound. Read that header before using this.
;
; WHY 60 AND NOT 30, and where 60 is STILL NOT COMPLIANT. EU868 BW125 CR4/5
; explicit header CRC on. The frame is 96 APPLICATION bytes (poll.h: 8 + 23 + 65
; once the diagnostic block widened to 29 registers on 2026-09-08) PLUS the
; mandatory 13-byte LoRaWAN header - 109 on air. An earlier version of this
; table omitted that header and was optimistic by ~11 %; corrected after review
; 2026-09-08.
;
;   DR3 (SF9) 594.9 ms -> 30 s = 1.98 %   60 s = 0.99 %   (+15 B FOpts: 1.09 %)
;   DR4 (SF8) 328.2 ms -> 30 s = 1.09 %   60 s = 0.55 %
;   DR5 (SF7) 184.6 ms -> 30 s = 0.62 %   60 s = 0.31 %
;
; So 30 s is over 1 % at DR3 AND at DR4. 60 s clears it at DR3 by 5 ms of
; margin, and a worst-case 15-byte FOpts field pushes even that over.
;
; AND AT DR0/DR1 60 s IS NOT COMPLIANT AT ALL. There the builder drops the
; diagnostic record and sends 31 application bytes, but SF11/SF12 are slow
; enough that it does not save it:
;
;   DR2 (SF10)  534.5 ms -> 60 s = 0.89 %   ok
;   DR1 (SF11) 1151.0 ms -> 60 s = 1.92 %   OVER
;   DR0 (SF12) 2138.1 ms -> 60 s = 3.56 %   OVER
;
; ADR is enabled, so DR0/DR1 are reachable in poor coverage. NOTHING IN THE
; FIRMWARE ENFORCES THIS: RadioLib 7.7.1 defaults dutyCycleEnabled to false and
; this repository never calls setDutyCycle(). Treat 60 s as a bench and
; good-coverage setting, not a field default.
;
; ENERGY, unchanged as a concern: config.h budgets the battery against 288
; wakes a day at 300 s. This is 1440, five times that. Fine on the bench or on
; mains; it is not a field setting.
[env:esp32s3_poll60]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DPOLL_INTERVAL_MS=60000


; 60 s cadence AND a BLE window that can stay open for a week.
;
; This replaces an earlier esp32s3_poll60_blealways, which re-raised the BLE
; window from maybe_sleep() whenever it fell. That was withdrawn: bleota.cpp
; allows five wrong `auth` guesses and then takes the radio down, and its own
; comment says why that is the whole gate - "a 16-bit nonce is a gate, not a
; cipher, and the only thing that makes it one is that guessing costs the
; attacker the window". Re-raising the window handed it straight back, and a
; fresh ble_ota_up() resets auth_fails (bleota.cpp:698), so five guesses per
; cycle became unlimited guesses and a 16-bit token falls in hours. Reconnecting
; alone does NOT reset the counter (bleota.cpp:676); only a bring-up does, which
; is why nothing else in the tree has this problem.
;
; This env raises the CEILINGS instead and leaves every gate in place. A CTRL
; session still has to grant the window, and because the window then never falls
; and comes back, auth_fails persists for the whole week: five wrong guesses and
; the radio goes down and stays down.
;
;   CTRL_MAX_SESSION_MIN 255      4.25 h, was 120 min
;   BLE_OTA_MAX_UP_MS    4.25 h   was 15 min
;   BLE_OTA_MAX_TOTAL_MS 7 days   was 1 h
;
; Not up from boot, which is the one behavioural difference: an operator opens
; the window once with a CTRL downlink and it then stays up. `blehold <minutes>`
; over the authenticated link extends it further and never shortens it.
;
; STILL TRUE, and the reason this is not a field image: an open BLE window
; blocks deep sleep, so for as long as the window is held the node does not
; sleep and config.h's battery budget does not apply. Mains or bench.
[env:esp32s3_poll60_blelong]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DPOLL_INTERVAL_MS=60000
	-DCTRL_MAX_SESSION_MIN=255
	-DBLE_OTA_MAX_UP_MS=15300000UL
	-DBLE_OTA_MAX_TOTAL_MS=604800000UL


; BLE-ONLY BENCH BUILD. No radio, no join, no RS-485, no sleep: the BLE window
; opens at boot with a FIXED compile-time nonce and re-opens when it expires.
;
; This exists so the BLE OTA receiver can be exercised on any bare ESP32-S3,
; without a gateway and - the point - without taking the one node that is
; carrying live measurements off the air.
;
; NEVER build this for a deployed node. The nonce is a constant in config.h, so
; the authentication gate is decorative, and the image cannot self-verify: it
; never joins and never reaches the bus, so it declines to confirm and rolls
; back at the next reset.
[env:esp32s3_blebench]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DPROTO_BLE_BENCH
	-DPROTO_BUS_OFF
	-DPROTO_NO_SLEEP
	-DPROTO_BENCH_CONFIRM_OTA=1


; LONG BLE WINDOW. Normal node in every other respect: LoRaWAN, the RS-485 bus
; and sleep all still work, and the CTRL nonce is still the real per-uplink one.
; The only change is how long one accepted CTRL session may hold BLE up.
;
; THREE bounds have to move together, because each of them independently takes
; the radio down and the shortest one wins:
;
;   CTRL_MAX_SESSION_MIN  the session itself. main.cpp:1214 calls
;                         ble_ota_down("CTRL session expired") when this lapses,
;                         so raising only the two BLE constants below changes
;                         nothing at all.
;   BLE_OTA_MAX_UP_MS     the per-bring-up lease, clamped inside ble_ota_up().
;                         Matched to the session so the lease is never the thing
;                         that cuts a granted session short.
;   BLE_OTA_MAX_TOTAL_MS  the bound a renewal cannot move, measured from
;                         bring-up. Left well above the session so a renewal
;                         chain is possible at all; see the caveat below.
;
; 255 IS A WIRE LIMIT, NOT A CHOICE. The requested duration is a single byte in
; the SESSION_OPEN frame (ctrl.cpp:52, `uint8_t want = frame[3]`) and
; max_minutes is uint8_t as well, so 255 minutes is the longest session that can
; be expressed. Anything larger here would silently truncate. Past 4h15m the
; only way to stay up is renewal, which needs a fresh nonce from a later uplink
; and therefore a working downlink.
;
; 7 days for the total is NOT arbitrary either: the deadline comparisons are
; int32_t differences on uint32_t millis() (bleota.cpp:904, :909), which stay
; correct only while the true difference is under 2^31 ms (~24.8 days). Seven
; days keeps a wide margin under that.
;
; COST, stated plainly: this deliberately re-opens the renewal loophole that
; BLE_OTA_MAX_TOTAL_MS was added to close. Continuous RX is ~15-33 mW, which
; ctrl.h:156 puts at the difference between ~240 and ~60 days on a 12 V 10 Ah
; AGM. Bench use, where the node is on a cable and somebody is watching.
; DELIBERATELY NOT extended from env:esp32s3_fastpoll, though an earlier version
; of this env was. Cadence and BLE window length are independent axes and must
; not be welded together here.
;
; fastpoll bakes POLL_INTERVAL_MS=30000 in as the COMPILE-TIME DEFAULT, and
; config.h:174 is explicit that this value is a default, not a lease - so it
; survives every reboot with no RTC lease left to expire. Measured 2026-09-08,
; once the T_AFE diag block took the frame to a 96-byte PHY payload: at DR3/SF9
; that is 533.5 ms of airtime, and one uplink every 30 s is 1.78 % duty cycle
; against the EU868 1 % limit. 30 s is only legal at DR4 (0.99 %) or DR5
; (0.55 %), and nothing in this firmware pins the data rate - ADR chooses it.
;
; So a fast cadence must be granted as a REVOCABLE LEASE, over CTRL or `cadence`,
; once the data rate is known to be DR4 or better. Compiling it in removes
; exactly the escape hatch that makes it safe.
[env:esp32s3_blelong]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DCTRL_MAX_SESSION_MIN=255
	-DBLE_OTA_MAX_UP_MS=15300000UL
	-DBLE_OTA_MAX_TOTAL_MS=604800000UL

[env:esp32s3_psrambench]
; BENCH ONLY - the second ESP32-S3 (MAC 7c:4f:ad:20:2a:28), which HAS 8 MB PSRAM.
; farm-node-01 does NOT, so anything measured here must be re-checked there before
; it is claimed for the deployed node.
extends = env:esp32s3_blebench
board_build.arduino.memory_type = qio_opi
; BENCH EXPERIMENT 2026-09-10, throughput only - NOT a shipping change.
build_flags =
	${env:esp32s3_blebench.build_flags}
	-DBOARD_HAS_PSRAM

